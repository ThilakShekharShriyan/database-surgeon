<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Database Surgeon — Forge write-up">
<title>Database Surgeon — Write-up</title>
<link rel="stylesheet" href="styles.css">
<style>
  .writeup { padding: 48px 0 24px; }
  .writeup h1 { font-size: clamp(26px, 4vw, 34px); letter-spacing: -0.03em; line-height: 1.2; margin: 0 0 16px; max-width: 20ch; }
  .writeup h2 { font-size: 15px; margin: 36px 0 10px; padding-top: 28px; border-top: 1px solid var(--line); }
  .writeup h3 { font-size: 14px; color: var(--ink); margin: 20px 0 8px; }
  .writeup p, .writeup li { color: var(--mute); font-size: 15px; line-height: 1.65; margin: 0 0 12px; }
  .writeup strong { color: var(--ink); font-weight: 600; }
  .writeup ul, .writeup ol { padding-left: 1.2em; margin: 0 0 14px; }
  .writeup hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
  .writeup a { color: var(--ink); }
  .writeup code { font: 12px/1.4 var(--mono); background: #f0f0ec; padding: 1px 5px; border-radius: 3px; color: var(--ink); }
  .writeup pre { margin: 0 0 16px; padding: 14px; background: #f0f0ec; border-radius: 4px; overflow: auto; font: 12px/1.7 var(--mono); color: var(--ink); }
  .writeup pre code { background: none; padding: 0; }
  .writeup table { width: 100%; border-collapse: collapse; margin: 0 0 18px; font-size: 13px; }
  .writeup th, .writeup td { text-align: left; padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .writeup th { font: 11px var(--mono); color: var(--mute); font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
  .writeup td { color: var(--ink); }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">Database Surgeon</a>
  <nav>
    <a href="index.html">Scoreboard</a>
    <a href="forge-research.md" download>Markdown</a>
  </nav>
</header>
<main>
  <article id="writeup" class="writeup">Loading…</article>
  <section class="foot-links">
    <a href="index.html">← Scoreboard</a>
    <a href="https://github.com/ThilakShekharShriyan/database-surgeon">GitHub</a>
  </section>
</main>
<script>
(function () {
  const root = document.getElementById('writeup');
  const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  function render(md) {
    const lines = md.replace(/\r\n/g,'\n').split('\n');
    const out = []; let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }
      if (line.startsWith('```')) {
        const buf = []; i++;
        while (i < lines.length && !lines[i].startsWith('```')) { buf.push(lines[i]); i++; }
        i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
      }
      if (/^\|/.test(line) && i + 1 < lines.length && /^\|?\s*-/.test(lines[i + 1])) {
        const rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) {
          if (!/^\|?\s*-/.test(lines[i])) rows.push(lines[i]);
          i++;
        }
        const cells = (row) => row.replace(/^\||\|$/g,'').split('|').map((c) => c.trim());
        let html = '<table><thead><tr>' + cells(rows[0]).map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
        for (let r = 1; r < rows.length; r++) html += '<tr>' + cells(rows[r]).map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>';
        out.push(html + '</tbody></table>'); continue;
      }
      if (line.startsWith('# ')) { out.push('<h1>' + inline(line.slice(2)) + '</h1>'); i++; continue; }
      if (line.startsWith('## ')) { out.push('<h2>' + inline(line.slice(3)) + '</h2>'); i++; continue; }
      if (line.startsWith('### ')) { out.push('<h3>' + inline(line.slice(4)) + '</h3>'); i++; continue; }
      if (line === '---') { out.push('<hr>'); i++; continue; }
      if (/^[-*] /.test(line)) {
        const items = [];
        while (i < lines.length && /^[-*] /.test(lines[i])) { items.push('<li>' + inline(lines[i].slice(2)) + '</li>'); i++; }
        out.push('<ul>' + items.join('') + '</ul>'); continue;
      }
      const para = [line]; i++;
      while (i < lines.length && lines[i].trim() && !/^#{1,3} |^```|^[-*] |^\d+\. |^\||^---$|^> /.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      out.push('<p>' + inline(para.join(' ')) + '</p>');
    }
    return out.join('\n');
  }
  fetch('forge-research.md').then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then((md) => { root.innerHTML = render(md); })
    .catch((e) => { root.innerHTML = '<p class="empty">Could not load write-up. <a href="forge-research.md">Open markdown</a> (' + esc(e.message) + ')</p>'; });
})();
</script>
</body>
</html>
