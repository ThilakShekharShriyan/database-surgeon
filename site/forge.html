<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Database Surgeon — Forge write-up">
<title>Database Surgeon — Write-up</title>
<link rel="stylesheet" href="styles.css">
<style>
  .writeup { margin-top: 0.5rem; }
  .writeup h1 {
    font: 700 16pt/1.25 var(--font);
    text-align: center;
    margin: 0 0 1rem;
  }
  .writeup h2 {
    font: 700 11pt/1.3 var(--font);
    margin: 1.35rem 0 0.5rem;
  }
  .writeup h3 {
    font: 700 10.5pt/1.3 var(--font);
    margin: 0.9rem 0 0.35rem;
    color: #000;
  }
  .writeup p, .writeup li {
    font: 11pt/1.35 var(--font);
    color: #000;
    text-align: justify;
    margin: 0 0 0.55rem;
  }
  .writeup ul, .writeup ol { padding-left: 1.25rem; margin: 0 0 0.75rem; }
  .writeup hr { border: 0; border-top: 1px solid #ccc; margin: 1.25rem 0; }
  .writeup a { color: #000; }
  .writeup code {
    font: 9pt/1.3 var(--mono);
    background: #f5f5f5;
    padding: 0 0.2rem;
  }
  .writeup pre {
    margin: 0 0 0.75rem;
    padding: 0.65rem 0.75rem;
    background: #f5f5f5;
    overflow: auto;
    font: 9pt/1.45 var(--mono);
  }
  .writeup pre code { background: none; padding: 0; }
  .writeup table { width: 100%; border-collapse: collapse; margin: 0 0 0.85rem; font: 10pt/1.3 var(--font); }
  .writeup th, .writeup td {
    text-align: left;
    padding: 0.3rem 0.35rem;
    border-top: 1px solid #000;
    border-bottom: 1px solid #000;
    vertical-align: top;
  }
  .writeup th { font-weight: 700; border-top: 2px solid #000; }
  .writeup tr:last-child td { border-bottom: 2px solid #000; }
  .back { margin-top: 1.5rem; font: 9pt/1.4 var(--sans); }
</style>
</head>
<body>
<article class="paper">
  <p class="conf" style="text-align:center;margin-bottom:1rem">
    <a href="index.html">← Scoreboard</a>
    &nbsp;·&nbsp;
    <a href="forge-research.md" download>Markdown</a>
  </p>
  <article id="writeup" class="writeup">Loading…</article>
  <p class="back"><a href="index.html">← Back to scoreboard</a></p>
</article>
<script>
(function () {
  const root = document.getElementById('writeup');
  const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  function render(md) {
    const lines = md.replace(/\r\n/g,'\n').split('\n');
    const out = []; let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }
      if (line.startsWith('```')) {
        const buf = []; i++;
        while (i < lines.length && !lines[i].startsWith('```')) { buf.push(lines[i]); i++; }
        i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
      }
      if (/^\|/.test(line) && i + 1 < lines.length && /^\|?\s*-/.test(lines[i + 1])) {
        const rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) {
          if (!/^\|?\s*-/.test(lines[i])) rows.push(lines[i]);
          i++;
        }
        const cells = (row) => row.replace(/^\||\|$/g,'').split('|').map((c) => c.trim());
        let html = '<table><thead><tr>' + cells(rows[0]).map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
        for (let r = 1; r < rows.length; r++) html += '<tr>' + cells(rows[r]).map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>';
        out.push(html + '</tbody></table>'); continue;
      }
      if (line.startsWith('# ')) { out.push('<h1>' + inline(line.slice(2)) + '</h1>'); i++; continue; }
      if (line.startsWith('## ')) { out.push('<h2>' + inline(line.slice(3)) + '</h2>'); i++; continue; }
      if (line.startsWith('### ')) { out.push('<h3>' + inline(line.slice(4)) + '</h3>'); i++; continue; }
      if (line === '---') { out.push('<hr>'); i++; continue; }
      if (/^[-*] /.test(line)) {
        const items = [];
        while (i < lines.length && /^[-*] /.test(lines[i])) { items.push('<li>' + inline(lines[i].slice(2)) + '</li>'); i++; }
        out.push('<ul>' + items.join('') + '</ul>'); continue;
      }
      const para = [line]; i++;
      while (i < lines.length && lines[i].trim() && !/^#{1,3} |^```|^[-*] |^\d+\. |^\||^---$|^> /.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      out.push('<p>' + inline(para.join(' ')) + '</p>');
    }
    return out.join('\n');
  }
  fetch('forge-research.md').then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then((md) => { root.innerHTML = render(md); })
    .catch((e) => { root.innerHTML = '<p class="empty">Could not load write-up. <a href="forge-research.md">Open markdown</a>.</p>'; });
})();
</script>
</body>
</html>
