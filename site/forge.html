<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Database Surgeon — Forge judge write-up: problem, baseline, harness, McNemar and bootstrap.">
<title>Database Surgeon — Forge write-up</title>
<link rel="stylesheet" href="styles.css">
<style>
  .writeup{max-width:820px;padding:46px 0 70px}
  .writeup h1{font-size:clamp(26px,3.5vw,36px);margin:28px 0 14px}
  .writeup h2{font-size:22px;margin:36px 0 12px;padding-top:8px;border-top:1px solid var(--rule)}
  .writeup h3{font-size:15px;margin:22px 0 8px}
  .writeup p,.writeup li{color:var(--muted);font-size:15px;line-height:1.75;margin:0 0 12px}
  .writeup strong{color:var(--text);font-weight:550}
  .writeup em{color:var(--text)}
  .writeup ul,.writeup ol{padding-left:1.3em;margin:0 0 16px}
  .writeup hr{border:0;border-top:1px solid var(--rule);margin:28px 0}
  .writeup a{color:var(--accent)}
  .writeup code{font:12px/1.5 var(--mono);background:var(--surface);padding:1px 5px;border-radius:3px;color:var(--text)}
  .writeup pre{margin:0 0 16px;padding:14px;background:var(--surface);border:1px solid var(--rule);overflow:auto;font:11px/1.8 var(--mono);border-radius:5px;color:var(--text)}
  .writeup pre code{background:none;padding:0}
  .writeup table{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:13px}
  .writeup th,.writeup td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
  .writeup th{color:var(--muted);font-weight:450;font-size:11px}
  .writeup td{color:var(--text)}
  .writeup blockquote{margin:0 0 16px;padding:10px 14px;border-left:2px solid var(--accent);background:var(--surface);color:var(--text)}
</style>
</head>
<body>
<a class="skip" href="#writeup">Skip to write-up</a>
<header class="mast">
  <a class="brand" href="index.html">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M5 9c0-3 22-3 22 0v14c0 4-22 4-22 0V9Zm0 0c0 4 22 4 22 0M5 16c0 3 11 4 16 2m-6 7 11-13 3 3-11 13-4 1Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    Database Surgeon <span>Write-up</span>
  </a>
  <nav aria-label="Research navigation">
    <a href="index.html">Research</a>
    <a href="index.html#results">Graphs</a>
    <a href="index.html#statistics">Paired tests</a>
    <a href="forge-research.md" download>Markdown ↓</a>
  </nav>
</header>

<main>
  <article id="writeup" class="writeup" aria-live="polite">Loading Forge write-up…</article>
</main>

<footer>
  <span>Forge · Fireworks × NVIDIA · sealed eval_v2</span>
  <span><a href="index.html">← Research site</a></span>
</footer>

<script>
(function () {
  const root = document.getElementById("writeup");

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  }

  function render(md) {
    const lines = md.replace(/\r\n/g, "\n").split("\n");
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }
      if (line.startsWith("```")) {
        const buf = [];
        i++;
        while (i < lines.length && !lines[i].startsWith("```")) { buf.push(lines[i]); i++; }
        i++;
        out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
        continue;
      }
      if (/^\|/.test(line) && i + 1 < lines.length && /^\|?\s*-/.test(lines[i + 1])) {
        const rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) {
          if (!/^\|?\s*-/.test(lines[i])) rows.push(lines[i]);
          i++;
        }
        const cells = (row) => row.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
        const head = cells(rows[0]);
        let html = "<table><thead><tr>" + head.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>";
        for (let r = 1; r < rows.length; r++) {
          html += "<tr>" + cells(rows[r]).map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>";
        }
        out.push(html + "</tbody></table>");
        continue;
      }
      if (line.startsWith("# ")) { out.push("<h1>" + inline(line.slice(2)) + "</h1>"); i++; continue; }
      if (line.startsWith("## ")) { out.push("<h2>" + inline(line.slice(3)) + "</h2>"); i++; continue; }
      if (line.startsWith("### ")) { out.push("<h3>" + inline(line.slice(4)) + "</h3>"); i++; continue; }
      if (line === "---") { out.push("<hr>"); i++; continue; }
      if (/^[-*] /.test(line)) {
        const items = [];
        while (i < lines.length && /^[-*] /.test(lines[i])) { items.push("<li>" + inline(lines[i].slice(2)) + "</li>"); i++; }
        out.push("<ul>" + items.join("") + "</ul>");
        continue;
      }
      if (/^\d+\. /.test(line)) {
        const items = [];
        while (i < lines.length && /^\d+\. /.test(lines[i])) {
          items.push("<li>" + inline(lines[i].replace(/^\d+\. /, "")) + "</li>");
          i++;
        }
        out.push("<ol>" + items.join("") + "</ol>");
        continue;
      }
      if (line.startsWith("> ")) { out.push("<blockquote><p>" + inline(line.slice(2)) + "</p></blockquote>"); i++; continue; }
      const para = [line];
      i++;
      while (i < lines.length && lines[i].trim() && !/^#{1,3} |^```|^[-*] |^\d+\. |^\||^---$|^> /.test(lines[i])) {
        para.push(lines[i]);
        i++;
      }
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }
    return out.join("\n");
  }

  fetch("forge-research.md")
    .then((r) => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then((md) => { root.innerHTML = render(md); })
    .catch((err) => {
      root.innerHTML = '<p class="empty">Could not load <code>forge-research.md</code> (' + esc(err.message) + '). <a href="forge-research.md">Open the markdown file</a>.</p>';
    });
})();
</script>
</body>
</html>
